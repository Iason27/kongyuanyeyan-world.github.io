{{/* 阅读字体：英文 Lora + 中文 思源宋体（自托管 static/fonts/） */}}

<link rel="stylesheet" href="{{ .Site.BaseURL }}css/custom.css">

{{/* GoatCounter 浏览量统计 — 自托管 count.js（gc.zgo.at 在国内被墙，改走本站 static/js/count.js） */}}

{{/* 阅读进度记忆(仅文章页自动启用) */}}
