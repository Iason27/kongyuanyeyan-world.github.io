{{- if .Param "comments" -}}
<div class="comments">
  <h3 class="comments-title"><svg class="comments-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>评论</h3>
  <script src="https://giscus.app/client.js"
          data-repo="Iason27/kongyuanyeyan-world.github.io"
          data-repo-id="R_kgDOTo25Fg"
          data-category="General"
          data-category-id="DIC_kwDOTo25Fs4DCXxt"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="{{ .Site.BaseURL }}css/giscus-light.css"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>
  <script>
    (function () {
      const THEMES = {
        light: "{{ .Site.BaseURL }}css/giscus-light.css",
        dark: "{{ .Site.BaseURL }}css/giscus-dark.css"
      };
      function currentTheme() {
        const t = document.documentElement.dataset.theme;
        if (t === "dark") return "dark";
        if (t === "light") return "light";
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      let lastSent = null;
      function applyGiscusTheme(force) {
        const iframe = document.querySelector("iframe.giscus-frame");
        if (!iframe) return false;
        const theme = THEMES[currentTheme()];
        if (!force && theme === lastSent) return true; // 主题没变就不重复发
        iframe.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme } } },
          "https://giscus.app"
        );
        lastSent = theme;
        return true;
      }
      // giscus 加载完成事件
      document.addEventListener("giscus:loaded", function () { applyGiscusTheme(true); });
      // iframe 自身 load 事件
      const iframeEl = document.querySelector("iframe.giscus-frame");
      if (iframeEl) iframeEl.addEventListener("load", function () { applyGiscusTheme(true); });
      // 监听站点主题切换（html[data-theme] 变化）
      const observer = new MutationObserver(function () { applyGiscusTheme(); });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      // auto 模式下跟随系统切换
      try {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { applyGiscusTheme(true); });
      } catch (e) {}
      // 兜底：持续轮询（每 1.5s，最长 5 分钟），直到发送成功过
      let sent = false;
      let ticks = 0;
      const timer = setInterval(function () {
        if (sent && ticks > 60) { clearInterval(timer); return; }
        if (applyGiscusTheme()) sent = true;
        ticks++;
        if (ticks > 200) clearInterval(timer);
      }, 1500);
    })();
  </script>
</div>
{{- end -}}
