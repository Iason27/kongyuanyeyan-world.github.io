{{- if .Param "comments" -}}
<div class="comments">
  <h3 class="comments-title"><svg class="comments-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>评论</h3>
  <div id="waline"></div>
</div>
<link rel="stylesheet" href="{{ .Site.BaseURL }}css/waline.css">
<script type="module">
  import { init } from "{{ .Site.BaseURL }}js/waline.js";
  init({
    el: "#waline",
    serverURL: "{{ .Site.Params.waline.serverURL }}",
    lang: "zh-CN",
    // 主题跟随站点:html[data-theme="dark"] 时自动切暗色
    dark: 'html[data-theme="dark"]',
    // 匿名留言:不开放注册登录,只需填昵称
    login: "disable",
    requiredFields: ["nick"],
    meta: ["nick", "mail", "link"],
    // 表情:自托管 bilibili + weibo 两套,国内加载稳
    emoji: [
      "{{ .Site.BaseURL }}emojis/bilibili",
      "{{ .Site.BaseURL }}emojis/weibo"
    ],
    // 头像走国内 Gravatar 镜像(cravatar),防止挂图
    avatar: "mp",
    avatarCDN: "https://cravatar.cn/avatar/",
    // 关闭非必要功能,保持简洁
    noRss: true,
    pageview: false,
    reaction: false,
    search: false,
    imageUploader: false,
    highlighter: false,
    copyright: false
  });
</script>
{{- end -}}
