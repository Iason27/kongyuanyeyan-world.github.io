baseURL = "https://iason27.github.io/kongyuanyeyan-world.github.io/"
languageCode = "zh-cn"
title = "我的同人文仓库"
theme = "PaperMod"

enableRobotsTXT = true
enableGitInfo = true

# 同人文隐私：禁止搜索引擎收录
[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  mainSections = []
  comments = true
  customHeadHTML = '<meta name="robots" content="noindex">'

[[menu.main]]
  identifier = "novels"
  name = "📚 长篇"
  pageRef = "novels"
  weight = 1

[[menu.main]]
  identifier = "short"
  name = "✍️ 短篇"
  pageRef = "short"
  weight = 2

[[menu.main]]
  identifier = "ideas"
  name = "💡 脑洞记录"
  pageRef = "ideas"
  weight = 3

[[menu.main]]
  identifier = "categories"
  name = "分类"
  pageRef = "categories"
  weight = 4

[[menu.main]]
  identifier = "tags"
  name = "标签"
  pageRef = "tags"
  weight = 5

[[menu.main]]
  identifier = "about"
  name = "关于"
  pageRef = "about"
  weight = 6

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
